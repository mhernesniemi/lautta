# Kamal settings shared by staging and production. Hosts and domains are in
# deploy.staging.yml and deploy.production.yml. Generated by lautta: `lautta doctor`
# shows how this file differs from the template.
service: {{service}}
image: <%= ENV.fetch("LAUTTA_IMAGE", "{{image}}") %>

servers:
  web:
    options:
      memory: {{memory}}

proxy:
  ssl: true
  app_port: 3000
  healthcheck:
    path: {{health_path}}
    interval: 2
    timeout: 3

registry:
  server: ghcr.io
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME", "registry-user-not-set") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

# Images are built and tested by the pipeline; Kamal only deploys them.
builder:
  arch: amd64

env:
{{env_block}}
{{#database}}

volumes:
  - {{service}}_data:/data

# Streams every database change to Object Storage (config/litestream.yml).
accessories:
  litestream:
    image: litestream/litestream:0.5.17
    roles:
      - web
    cmd: replicate
    files:
      - config/litestream.yml:/etc/litestream.yml
    volumes:
      - {{service}}_data:/data
    env:
      clear:
        DATABASE_FILE: {{database}}
        LITESTREAM_PATH: {{service}}/{{database}}
      secret:
        - LITESTREAM_BUCKET
        - LITESTREAM_ENDPOINT
        - LITESTREAM_ACCESS_KEY_ID
        - LITESTREAM_SECRET_ACCESS_KEY
{{/database}}

logging:
  driver: json-file
  options:
    max-size: 10m
    max-file: 3

ssh:
  user: deploy

drain_timeout: 15
retain_containers: 5

aliases:
  logs: app logs --lines 200
  shell: app exec --interactive --reuse "sh"
